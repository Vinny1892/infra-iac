deployment:
  kind: DaemonSet

# A DaemonSet using host ports cannot surge on a single-node cluster: the new
# pod would contend with the old one for those ports and remain Pending.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

service:
  type: LoadBalancer

ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443
  minecraft:
    port: 25565
    expose:
      default: true
    hostPort: 25565
    protocol: TCP

providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

logs:
  general:
    level: INFO
