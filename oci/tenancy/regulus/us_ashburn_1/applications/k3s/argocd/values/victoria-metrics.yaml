nameOverride: vmks
argocdReleaseOverride: vmks

victoria-metrics-operator:
  resources:
    requests:
      cpu: 80m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

vmsingle:
  enabled: true
  spec:
    retentionPeriod: 14d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 750m
        memory: 1Gi
    storage:
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi

vmcluster:
  enabled: false

vmdistributed:
  enabled: false

# VictoriaLogs. Escolhido no lugar do Loki por coerencia de plataforma: o
# operator VictoriaMetrics ja roda neste cluster e ja traz os CRDs de logs
# (vlsingle, vlagent), entao nao entra operator nem chart novo. A limitacao do
# VictoriaLogs de nao ter backend S3 nao pesa aqui, porque o PVC fica no Longhorn
# e o backup remoto para S3 ja e feito por ele.
vlsingle:
  enabled: true
  spec:
    # Mesma janela do vmsingle: metrica e log da mesma hora contam a mesma
    # historia, e retencoes diferentes tornam a correlacao confusa.
    retentionPeriod: 14d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storage:
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          # Com os 20Gi daqui o total alocado no Longhorn vai a ~57Gi dos 96Gi
          # disponiveis, deixando margem para snapshot e rebuild.
          storage: 20Gi

# Coletor de logs. O k8sCollector le os logs dos containers do node e envia ao
# vlsingle — por isso nao ha Promtail (EOL em marco/2026), Vector ou Fluent Bit
# nesta stack: a coleta ja vem do proprio ecossistema.
vlagent:
  enabled: true
  spec:
    k8sCollector:
      enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi

vtsingle:
  enabled: false

alertmanager:
  enabled: false

vmalert:
  enabled: false

vmagent:
  enabled: true
  spec:
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi
    extraArgs:
      promscrape.streamParse: "true"

# O kubelet repete estas tres metricas de container em /metrics/cadvisor e
# /metrics/resource. Mantemos o resource endpoint pelas metricas pod_* e node_*
# exclusivas dele, mas descartamos apenas as copias; cadvisor segue como fonte.
kubelet:
  vmScrapes:
    resources:
      spec:
        metricRelabelConfigs:
          # Esta lista substitui a configuracao comum do chart neste scrape;
          # preservar os drops padrao evita reintroduzir labels de cardinalidade.
          - action: labeldrop
            regex: (uid)
          - action: labeldrop
            regex: (id|name)
          - action: drop
            source_labels: [__name__]
            regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
          - action: drop
            source_labels: [__name__]
            regex: (container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_start_time_seconds)

grafana:
  enabled: true
  # Senha do admin vem do 1Password via ExternalSecret (manifests/monitoring/).
  # Sem isto o chart gera `randAlphaNum 40` a cada render e o Secret passa a
  # divergir do banco, que vive no PVC e so conhece a senha da inicializacao.
  admin:
    existingSecret: grafana-admin
  # O datasource VictoriaLogs e provisionado pelo proprio chart
  # (defaultDatasources.victorialogs), mas depende deste plugin. O Grafana
  # baixa na inicializacao do pod, entao exige saida para a internet.
  plugins:
    - victoriametrics-logs-datasource
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  persistence:
    enabled: true
    type: pvc
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 2Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: grafana-k3s.vinny.dev.br
    hosts:
      - grafana-k3s.vinny.dev.br
    tls:
      - secretName: grafana-k3s-tls
        hosts:
          - grafana-k3s.vinny.dev.br

prometheus-node-exporter:
  resources:
    requests:
      cpu: 30m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

# Estes componentes do K3s nao expõem os endpoints da mesma forma que um
# cluster kubeadm; desabilitar os scrapes evita targets e alertas falsos.
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false
