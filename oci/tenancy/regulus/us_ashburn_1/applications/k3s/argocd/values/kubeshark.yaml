# Kubeshark — analisador de tráfego do cluster.
#
# ATENÇÃO ao que este chart instala: o worker é DaemonSet com
# `privileged: true` nos dois containers (sniffer e tracer) e `hostNetwork:
# true`. É o workload mais privilegiado deste cluster — mais que o Cowrie, que
# roda non-root. Comprometer o worker é root no node, e com hostNetwork é a
# rede do host inteira. Não é defeito do chart: é o que sniffar tráfego exige.
#
# E o que ele coleta é dado sensível: tráfego em claro dentro do cluster inclui
# token em header e credencial de conexão de banco. Acesso à interface do
# Kubeshark é acesso a segredo em trânsito, não a metadado.
tap:
  # Limites obrigatórios. O default do chart é `cpu: "0"` (ilimitado) e
  # `memory: 5Gi` por componente, com requests de 50Mi — combinação que o
  # scheduler aceita de boa e que depois infla até derrubar o node. Numa
  # danebola com ~1,2 GiB de folga isso é OOM esperando acontecer.
  #
  # Medido no render: com estes valores o DaemonSet pede 50m/128Mi por node e
  # tem teto de 500m/640Mi.
  resources:
    hub:
      limits:
        cpu: "500m"
        memory: 512Mi
      requests:
        cpu: 25m
        memory: 64Mi
    sniffer:
      limits:
        cpu: "300m"
        memory: 384Mi
      requests:
        cpu: 25m
        memory: 64Mi
    tracer:
      limits:
        cpu: "200m"
        memory: 256Mi
      requests:
        cpu: 25m
        memory: 64Mi

  # Não há chave `tap.resources.front`: o front vem com 750m/1Gi de limite
  # fixos do chart. Request é 50Mi, então não atrapalha agendamento — mas o
  # teto não é nosso.

  # Storage apertado de propósito. O default (`storageLimit: 10Gi`,
  # `snapshots.local.storageSize: 20Gi`, `capture.raw.storageSize: 1Gi`) foi
  # dimensionado para cluster com disco sobrando. Aqui a franquia de block
  # storage já está estourada pelo split, e com Longhorn em 2 réplicas cada GB
  # conta dobrado.
  #
  # Conferido no render: com estes valores o chart não cria PVC nenhum.
  storageLimit: 2Gi
  capture:
    raw:
      storageSize: 512Mi
    dbMaxSize: 200Mi
  snapshots:
    local:
      storageSize: 2Gi

  # Ingress do chart desligado: o nosso vive em manifests/kubeshark-config/,
  # com o middleware de basic auth. O motivo é que `tap.auth` do Kubeshark só
  # suporta SAML e vem desabilitado — não existe basic auth nativo aqui, ao
  # contrário do MCP do Grafana, que tem bearer próprio. É neste componente que
  # o middleware do Traefik finalmente é a única proteção possível.
  ingress:
    enabled: false

# Sem telemetria de licença para a nuvem do fornecedor.
#
# O default é `true`, apontando para api.kubeshark.com. Um sniffer de tráfego
# que fala com o fornecedor por default merece decisão explícita, não herança.
#
# RESSALVA NÃO VERIFICADA: o render funciona com `false`, mas eu não confirmei
# se o produto opera sem o check de licença ou se alguma funcionalidade cai.
# Se a interface reclamar de licença, é aqui que se olha primeiro.
cloudLicenseEnabled: false
