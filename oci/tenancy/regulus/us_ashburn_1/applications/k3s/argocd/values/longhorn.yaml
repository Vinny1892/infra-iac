# Duas replicas desde o split do cluster em vm-regulus + danebola.
#
# Com um no so, replica 2 deixava todo PVC Degraded para sempre — nao havia
# onde por a segunda copia. Com dois nos, replica 2 e o que da sentido ao
# split: e a unica configuracao em que perder um no nao perde dado, e em que
# um pod pode ser reagendado no outro no e ainda achar o volume local.
#
# Custo: cada volume ocupa espaco nos DOIS discos de 100 GB. Os 57 GB de PVCs
# provisionados viram 57 GB em cada no. O Longhorn provisiona fino, entao o
# consumo real hoje e uma fracao disso, mas o agendamento reserva pelo tamanho
# declarado.
defaultSettings:
  defaultReplicaCount: 2

preUpgradeChecker:
  jobEnabled: false

# A StorageClass `longhorn` tambem precisa refletir a contagem de nos. Sem
# isto ela usa o default do chart (tres replicas) e deixa todo PVC
# permanentemente Degraded, porque a terceira copia nao tem onde morar.
persistence:
  defaultClassReplicaCount: 2
