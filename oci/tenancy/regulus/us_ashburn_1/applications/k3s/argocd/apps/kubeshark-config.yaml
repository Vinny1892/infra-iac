# Ingress, certificado e autenticação do Kubeshark.
#
# Separado da Application do chart pelo mesmo motivo de `cert-manager-config` e
# `monitoring-config`: uma Application tem uma fonte, e ali é o chart Helm. O
# que é nosso mora em manifests/ e vem por esta.
#
# `CreateNamespace` fica DESLIGADO: o namespace `kubeshark` pertence à
# Application do chart. Com as duas criando, uma delas passa a brigar pela
# posse do objeto.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeshark-config
  namespace: argocd
  annotations:
    # Wave 5, depois do chart (wave 4): o Ingress aponta para o Service
    # `kubeshark-front`, que só existe depois de o chart aplicar. O Traefik
    # tolera backend ausente, mas a ordem certa evita um intervalo de 503.
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Vinny1892/infra-iac.git
    targetRevision: master
    path: oci/tenancy/regulus/us_ashburn_1/applications/k3s/argocd/manifests/kubeshark-config
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeshark
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # Os Middlewares são CRs do Traefik. Num cluster recriado, o ArgoCD pode
      # tentar aplicá-los antes de o cache de discovery do apiserver conhecer o
      # tipo — o mesmo `no matches for kind` que travou o victoria-metrics.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
