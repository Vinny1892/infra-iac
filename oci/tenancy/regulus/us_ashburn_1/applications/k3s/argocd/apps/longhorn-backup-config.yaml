apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-backup-config
  namespace: argocd
  annotations:
    # Depois do chart/CRDs Longhorn (wave 1) e antes do Minecraft (wave 3).
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Vinny1892/infra-iac.git
    targetRevision: master
    path: oci/tenancy/regulus/us_ashburn_1/applications/k3s/argocd/manifests/longhorn-backup-config
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
