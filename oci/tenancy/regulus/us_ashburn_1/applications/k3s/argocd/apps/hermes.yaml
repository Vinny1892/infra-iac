apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Vinny1892/infra-iac.git
    targetRevision: master
    path: oci/tenancy/regulus/us_ashburn_1/applications/k3s/argocd/manifests/hermes
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    automated:
      # prune desligado de proposito: com prune ligado, remover o app do git
      # apagaria o PVC e junto o auth.json do Codex, as sessoes e as skills.
      # O estado aqui nao e reconstruivel a partir do repositorio.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
