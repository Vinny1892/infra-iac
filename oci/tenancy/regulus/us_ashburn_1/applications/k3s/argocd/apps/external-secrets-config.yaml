apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  annotations:
    # Antes de qualquer app que consuma ExternalSecret. O ClusterSecretStore
    # precisa existir primeiro, senao os ExternalSecrets ficam em SecretSyncedError
    # ate a proxima reconciliacao.
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Vinny1892/infra-iac.git
    targetRevision: master
    path: oci/tenancy/regulus/us_ashburn_1/applications/k3s/argocd/manifests/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      # O namespace, o chart e o Secret do token pertencem ao seed Terraform.
      # Este app gerencia so o ClusterSecretStore.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
