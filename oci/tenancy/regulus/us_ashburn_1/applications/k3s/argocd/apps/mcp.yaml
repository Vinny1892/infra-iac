# Servidores MCP consumidos pelo agente do mercurio, e o basic auth que os
# protege.
#
# Existe desde o primeiro manifesto em manifests/mcp/ de proposito: diretorio de
# manifests sem Application propria fica no git sem nunca ser aplicado, e o
# sintoma e o pior possivel — o arquivo esta lá, o `git log` mostra o commit, e
# nada acontece no cluster. Já aconteceu com o Secret do Grafana.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp
  namespace: argocd
  annotations:
    # Depois do external-secrets (wave 2): o Middleware referencia um Secret que
    # so existe quando o ESO tiver reconciliado o ExternalSecret. O Traefik
    # tolera a ausencia (o router fica em erro e volta sozinho), mas subir na
    # ordem certa evita um intervalo de 401 inexplicado.
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Vinny1892/infra-iac.git
    targetRevision: master
    path: oci/tenancy/regulus/us_ashburn_1/applications/k3s/argocd/manifests/mcp
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # O Middleware e uma CR do Traefik. Num cluster recriado, o ArgoCD pode
      # tentar aplica-lo antes de o cache de discovery do apiserver conhecer o
      # tipo — o mesmo `no matches for kind` que travou o victoria-metrics.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
