apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-memory
  namespace: argocd
  annotations:
    # Depende do Longhorn (wave 1) para provisionar os volumes.
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Vinny1892/infra-iac.git
    targetRevision: master
    path: oci/tenancy/regulus/us_ashburn_1/applications/k3s/argocd/manifests/ai-memory
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-memory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 2m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
