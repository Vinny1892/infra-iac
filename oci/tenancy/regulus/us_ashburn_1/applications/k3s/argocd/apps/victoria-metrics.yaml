apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts/
      chart: victoria-metrics-k8s-stack
      targetRevision: 0.91.2
      helm:
        releaseName: vmks
        valueFiles:
          - $values/oci/tenancy/regulus/us_ashburn_1/applications/k3s/argocd/values/victoria-metrics.yaml
    - repoURL: https://github.com/Vinny1892/infra-iac.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Este app entrega CRDs e CRs do operator no MESMO sync. O ArgoCD aplica as
    # CRDs e, em seguida, tenta aplicar VMSingle/VMAgent/VLSingle/VLAgent antes
    # de o cache de discovery do apiserver conhecer os tipos novos:
    #   resource mapping not found ... no matches for kind "VMAgent"
    #   in version "operator.victoriametrics.com/v1beta1"
    # Observado num deploy real: as CRDs ficaram Established, mas as CRs falharam
    # e nunca subiram — vmsingle, vmagent e a stack de logs simplesmente nao
    # existiam, com o app parado em Progressing.
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Evita que o dry-run falhe por tipo ainda desconhecido no mesmo sync.
      - SkipDryRunOnMissingResource=true
