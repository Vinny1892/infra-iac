# Kubeshark, instalado só pelo ArgoCD.
#
# Não entra no seed Terraform, pelo mesmo critério do External Secrets
# Operator: nada no `deploy.sh` depende dele. Instalar nos dois lugares faria o
# `helm_release` recusar adotar o que o ArgoCD já aplicou.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeshark
  namespace: argocd
  annotations:
    # Wave 4, depois da plataforma. Ele não é dependência de ninguém e é o
    # componente mais pesado a subir; deixar para o fim evita competir por
    # memória com o que importa durante a reconciliação inicial.
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://helm.kubeshark.com
      chart: kubeshark
      targetRevision: 53.4.0
      helm:
        valueFiles:
          - $values/oci/tenancy/regulus/us_ashburn_1/applications/k3s/argocd/values/kubeshark.yaml
    - repoURL: https://github.com/Vinny1892/infra-iac.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeshark
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
