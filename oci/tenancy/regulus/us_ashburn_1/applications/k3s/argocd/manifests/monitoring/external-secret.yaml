# Credencial do admin do Grafana vinda do 1Password.
#
# Sem isto, o chart gera `randAlphaNum 40` a CADA render. O banco do Grafana vive
# num PVC e so aceita a senha com que foi inicializado, entao a cada sync o
# Secret passava a anunciar uma senha que o banco nao conhecia — o sintoma era
# HTTP 401 com o Secret aparentemente correto.
#
# Com `admin.existingSecret` apontando para ca, o valor deixa de ser gerado e
# passa a vir do cofre, igual entre recriacoes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    # As chaves seguem o default do chart do Grafana (admin.userKey /
    # admin.passwordKey), por isso nao precisam ser declaradas nos values.
    - secretKey: admin-user
      remoteRef:
        key: Grafana K3s/username
    - secretKey: admin-password
      remoteRef:
        key: Grafana K3s/password
