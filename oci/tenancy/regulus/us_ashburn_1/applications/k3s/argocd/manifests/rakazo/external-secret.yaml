# Segredos do piloto Rakazo via External Secrets Operator.
# Item "Rakazo Pilot" no vault Lab-IAC (criado 2026-11-27). Padrão do repo:
# nada de secretGenerator com valores no git; o ESO reconcilia o Secret nativo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rakazo-secrets
  namespace: rakazo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: rakazo-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: Rakazo Pilot/POSTGRES_PASSWORD
    - secretKey: DATABASE_MIGRATION_URL
      remoteRef:
        key: Rakazo Pilot/DATABASE_MIGRATION_URL
    - secretKey: DATABASE_URL
      remoteRef:
        key: Rakazo Pilot/DATABASE_URL
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: Rakazo Pilot/ENCRYPTION_KEY
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: Rakazo Pilot/BETTER_AUTH_SECRET
    - secretKey: SCREEN_PROXY_SECRET
      remoteRef:
        key: Rakazo Pilot/SCREEN_PROXY_SECRET
    - secretKey: OWNER_PASSWORD
      remoteRef:
        key: Rakazo Pilot/OWNER_PASSWORD
