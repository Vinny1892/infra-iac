# Credencial do basic auth dos MCPs, vinda do 1Password.
#
# O item guarda a linha de htpasswd **ja com hash bcrypt**, e nao a senha em
# claro. Isso nao e preferencia: o ESO transporta o valor sem transformar, entao
# quem tem de hashear e quem grava no cofre. Guardar a senha crua aqui faria o
# Traefik compara-la com o hash que ele espera e recusar todo login.
#
# O item tem tambem um campo `password` em claro, para uso humano — ele NAO e
# referenciado aqui de proposito. O Secret do cluster carrega apenas o hash.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-basic-auth
  namespace: mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: mcp-basic-auth
    creationPolicy: Owner
  data:
    # `users` e obrigatorio: e o nome de chave que o basicAuth do Traefik le, e
    # nao ha opcao para muda-lo. Renomear aqui quebra a autenticacao sem erro
    # no ExternalSecret — o Secret e criado normalmente, so nao serve.
    - secretKey: users
      remoteRef:
        key: MCP Basic Auth/htpasswd
