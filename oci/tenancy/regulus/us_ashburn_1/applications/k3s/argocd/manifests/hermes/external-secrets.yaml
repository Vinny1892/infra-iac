# Segredos do Hermes vindos do 1Password.
#
# Antes destes objetos, os dois Secrets abaixo eram criados a mao e nao
# sobreviviam a uma recriacao do cluster — era o motivo de o Hermes ficar em
# CreateContainerConfigError depois de todo destroy/deploy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-dashboard-auth
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: hermes-dashboard-auth
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: Hermes/username
    # Texto puro de proposito: o deployment usa
    # HERMES_DASHBOARD_BASIC_AUTH_PASSWORD, que tem precedencia sobre a variante
    # _HASH e e hasheado em memoria pelo proprio Hermes no load. O ESO
    # transporta valores sem transformar — nao ha como ele gerar o scrypt.
    - secretKey: password
      remoteRef:
        key: Hermes/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-telegram-bot
  namespace: hermes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: hermes-telegram-bot
    creationPolicy: Owner
  data:
    # O item no cofre chama o campo de `credencial`; o deployment espera `token`.
    # O mapeamento acontece aqui, e nao renomeando um dos dois lados.
    - secretKey: token
      remoteRef:
        key: telegram bot/credencial
