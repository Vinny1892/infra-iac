apiVersion: v1
kind: ConfigMap
metadata:
  name: cowrie-config
  namespace: honeypot
data:
  # Só overrides: a imagem traz etc/cowrie.cfg.dist com os defaults, e o Cowrie
  # lê os dois. Por isso estes arquivos entram por subPath no Deployment — um
  # mount de diretório inteiro em etc/ esconderia o .dist e o processo subiria
  # sem configuração nenhuma.
  cowrie.cfg: |
    [honeypot]
    # Hostname que o atacante vê no prompt. Nada que entregue o honeypot: se o
    # prompt disser "cowrie", o bot desconecta antes de digitar qualquer coisa
    # e a captura de comandos se perde.
    hostname = srv-app-03
    ttylog = true

    # Chamaria api.ipify.org no boot. A NetworkPolicy corta o egress, então a
    # chamada só renderia timeout no startup.
    report_public_ip = false

    [ssh]
    enabled = true
    listen_endpoints = tcp:2222:interface=0.0.0.0
    # Banner de um Ubuntu 24.04 corrente. O banner default do Cowrie é
    # reconhecido por scanners que mantêm fingerprint de honeypot.
    version = SSH-2.0-OpenSSH_9.6p1 Ubuntu-3ubuntu13.5

    [telnet]
    # A security list não abre 23; deixar ligado só geraria porta escutando sem
    # tráfego possível.
    enabled = false

    [output_jsonlog]
    enabled = true
    logfile = var/log/cowrie/cowrie.json

  # Formato: usuario:x:senha. "*" aceita qualquer senha, "!" nega uma
  # específica. O objetivo aqui é deixar entrar quase tudo — o valor está nos
  # comandos digitados depois do login, não em barrar a autenticação.
  userdb.txt: |
    root:x:!root
    root:x:!123456
    root:x:*
    admin:x:*
    ubuntu:x:*
    oracle:x:*
    user:x:*
