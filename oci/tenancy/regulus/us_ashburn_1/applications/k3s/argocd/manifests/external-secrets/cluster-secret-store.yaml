# Fonte unica de segredos do cluster.
#
# O provider `onepasswordSDK` autentica direto na nuvem do 1Password com um
# token de Service Account — sem o servidor 1Password Connect, que exigiria mais
# um componente com estado rodando aqui dentro. A documentacao do ESO recomenda
# este provider, e os dois nao sao intercambiaveis: o Connect usa outro formato
# de token e outro caminho de autenticacao.
#
# Um store atende um vault, por desenho do provider, para impedir acesso
# cruzado. Por isso as credenciais que o cluster consome vivem todas no Lab-IAC,
# e o token que da acesso a elas fica separado, no vault IAM.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: Lab-IAC
      auth:
        serviceAccountSecretRef:
          name: onepassword-token
          namespace: external-secrets
          key: token
      # O SDK devolve todos os campos do item a cada chamada; o cache evita
      # repetir a ida ate a nuvem para cada campo lido.
      cache:
        ttl: 5m
        maxSize: 100
