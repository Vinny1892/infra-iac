apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
spec:
  replicas: 1
  # Recreate, nao RollingUpdate: o estado e SQLite num volume ReadWriteOnce.
  # Dois pods simultaneos disputariam o mesmo arquivo e o volume sequer
  # permitiria o attach duplo — o rollout ficaria travado.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      securityContext:
        # Casa com HERMES_UID/HERMES_GID abaixo. O s6-overlay remapeia o
        # usuario interno para esses valores e cada servico faz setuidgid para
        # ele; sem o fsGroup o volume do Longhorn monta como root e o container
        # nao consegue escrever em /opt/data.
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.8.27
          # ENTRYPOINT nao e sobrescrito de proposito. A imagem usa
          # ["/init", "/opt/hermes/docker/main-wrapper.sh"], onde /init e o PID 1
          # do s6-overlay que roda os cont-init.d (chown, reconcile de profile,
          # toggle do dashboard) e monta a arvore de supervisao. Passar por cima
          # disso quebra o gateway.
          args:
            - gateway
            - run
          env:
            - name: HERMES_UID
              value: "10000"
            - name: HERMES_GID
              value: "10000"
            # Sobe o dashboard como servico supervisionado pelo s6 no mesmo
            # container.
            - name: HERMES_DASHBOARD
              value: "1"
            # O Hermes se recusa a expor o dashboard em 0.0.0.0 sem um auth
            # provider registrado ("There is no unauthenticated public-dashboard
            # option") e nao aceita proxy autenticado na frente como
            # substituto — sem isto o processo nem sobe e o pod fica 0/1.
            # O Cloudflare Access segue como primeira camada; esta e a segunda,
            # exigida pela propria aplicacao.
            #
            # O Secret hermes-dashboard-auth NAO esta neste repositorio: e
            # criado fora do GitOps e precisa ser recriado a mao apos um
            # destroy. Guarda o hash scrypt, nunca a senha em texto puro.
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hermes-dashboard-auth
                  key: username
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: hermes-dashboard-auth
                  key: password_hash
            # Cada comando do agente roda em um container separado no daemon
            # Docker do sidecar abaixo. O Hermes em si continua sem privilege.
            - name: TERMINAL_ENV
              value: docker
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2375
            - name: TERMINAL_DOCKER_IMAGE
              value: nikolaik/python-nodejs:python3.11-nodejs20
            # Nao encaminhar tokens do pod nem credenciais do Hermes para os
            # containers que o agente criar.
            - name: TERMINAL_DOCKER_FORWARD_ENV
              value: "[]"
            # O daemon e efemero por design; nao manter filesystem de comandos
            # entre reinicios evita acumular estado executavel fora do PVC.
            - name: TERMINAL_CONTAINER_PERSISTENT
              value: "false"
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-telegram-bot
                  key: token
            # Allowlist estrita: qualquer outro ID recebe deny antes de o
            # agente processar a mensagem, inclusive em grupos e foruns.
            - name: TELEGRAM_ALLOWED_USERS
              value: "802586621"
          ports:
            - name: gateway
              containerPort: 8642
            - name: dashboard
              containerPort: 9119
          # Probes TCP em vez de HTTP: o endpoint de health do gateway fica na
          # 8642, que so escuta com API_SERVER_ENABLED=true — desligado aqui.
          # Nao inventei um path de health que eu nao verifiquei.
          startupProbe:
            tcpSocket:
              port: dashboard
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: dashboard
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
        # O DinD e a fronteira de execucao dos comandos do agente. Ele e o
        # unico container privilegiado: nao recebe PVC, tokens ou kubeconfig.
        - name: docker
          image: docker:27-dind
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          ports:
            - name: docker
              containerPort: 2375
          readinessProbe:
            tcpSocket:
              port: docker
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: docker-data
          emptyDir: {}
