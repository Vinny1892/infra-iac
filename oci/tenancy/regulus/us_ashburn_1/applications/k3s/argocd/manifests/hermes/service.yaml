apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
spec:
  selector:
    app: hermes
  ports:
    # Dashboard: unica porta publicada no Ingress, atras do Cloudflare Access.
    - name: dashboard
      port: 9119
      targetPort: dashboard
    # Gateway/API: exposto apenas dentro do cluster. So responde se
    # API_SERVER_ENABLED=true for adicionado ao Deployment.
    - name: gateway
      port: 8642
      targetPort: gateway
