# Senha do RCON vinda do 1Password.
#
# Migrou do bootstrap-longhorn-backup.sh porque quem a consome — o deployment do
# Minecraft e o CronJob de backup — vem do ArgoCD, ou seja, depois do ESO. Ja a
# credencial S3 do Longhorn continua no bootstrap: ela e necessaria no
# restore_minecraft_data, que roda ANTES do deploy_root_app instalar o ESO.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minecraft-rcon
  namespace: minecraft
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: minecraft-rcon
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: Minecraft RCON/password
