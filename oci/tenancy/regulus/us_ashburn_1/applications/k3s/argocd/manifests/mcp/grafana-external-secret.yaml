# Token do service account do Grafana consumido pelo MCP.
#
# É um service account dedicado (`mcp-grafana`, id 2), com role **Viewer** — não
# a credencial de admin que o `monitoring/external-secret.yaml` traz. Começou em
# Viewer de propósito: ampliar permissão é uma linha, estreitar depois que o
# agente já dependia dela é bem mais caro.
#
# Se o agente precisar escrever (criar anotação, salvar dashboard), o caminho é
# subir o role do service account no Grafana — e não emprestar a credencial de
# admin para o MCP.
#
# Para revogar: DELETE /api/serviceaccounts/2/tokens/1, ou desabilitar o service
# account na UI. O token não é derivável da senha do admin, então revogá-lo não
# afeta mais nada.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp-token
  namespace: mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: grafana-mcp-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: Grafana MCP Token/credential
