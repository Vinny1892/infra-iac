# Token do service account do Grafana consumido pelo MCP.
#
# É um service account dedicado (`mcp-grafana`, id 2), com role **Viewer** — não
# a credencial de admin que o `monitoring/external-secret.yaml` traz. Começou em
# Viewer de propósito: ampliar permissão é uma linha, estreitar depois que o
# agente já dependia dela é bem mais caro.
#
# Se o agente precisar escrever (criar anotação, salvar dashboard), o caminho é
# subir o role do service account no Grafana — e não emprestar a credencial de
# admin para o MCP.
#
# Para revogar: DELETE /api/serviceaccounts/2/tokens/1, ou desabilitar o service
# account na UI. O token não é derivável da senha do admin, então revogá-lo não
# afeta mais nada.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp-token
  namespace: mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: grafana-mcp-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: Grafana MCP Token/credential
---
# Bearer token que o servidor MCP exige de QUEM O CHAMA.
#
# São dois tokens com nomes parecidos e direções opostas — vale não confundir:
#
#   Grafana MCP Token         → o MCP usa para consultar o Grafana (service
#                               account `mcp-grafana`, role Viewer)
#   Grafana MCP Server Token  → o cliente (agente) usa para provar-se ao MCP
#
# Este segundo existe porque o MCP, servindo em endereço não-loopback, aceita
# qualquer chamador por default e loga: "Anyone who can reach this address can
# invoke MCP tools and use any Grafana credentials the server is configured
# with". O basic auth do Traefik cobriria só o caminho do Ingress; isto cobre
# também quem alcança o ClusterIP de dentro do cluster. E o upstream avisa que
# a ausência dele virará erro de inicialização.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp-server-token
  namespace: mcp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: grafana-mcp-server-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: Grafana MCP Server Token/credential
