# API, worker e web do Rakazo.
#
# A imagem aponta para o GHCR do FORK (vinny1892/rakazo/app:sha-<commit>),
# publicada pela action publish-server-image.yml — contém os commits custom.
# Substituir <APP_IMAGE> pelo sha-<commit> do build em vigor no momento do
# merge (a tag sha- usa o SHA-40 do commit; DOCKER_METADATA_SHORT_SHA_LENGTH=40).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rakazo-api
  labels:
    rakazo.example/phase: app
  namespace: rakazo
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rakazo-api
  template:
    metadata:
      labels:
        app: rakazo-api
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: api
          image: ghcr.io/vinny1892/rakazo/app:sha-f369df831ef84f5554be4c462108d4cbc855de4c
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: DATABASE_URL
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: ENCRYPTION_KEY
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: BETTER_AUTH_SECRET
            - name: SCREEN_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: SCREEN_PROXY_SECRET
          envFrom:
            - configMapRef:
                name: rakazo-config
          command:
            - node
            - --enable-source-maps
            - dist/index.js
          workingDir: /app/apps/api
          ports:
            - containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            timeoutSeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      terminationGracePeriodSeconds: 60
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rakazo-data-pilot
---
apiVersion: v1
kind: Service
metadata:
  name: rakazo-api
  labels:
    rakazo.example/phase: foundation
  namespace: rakazo
spec:
  selector:
    app: rakazo-api
  ports:
    - port: 3100
      targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rakazo-worker
  labels:
    rakazo.example/phase: app
  namespace: rakazo
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rakazo-worker
  template:
    metadata:
      labels:
        app: rakazo-worker
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: worker
          image: ghcr.io/vinny1892/rakazo/app:sha-f369df831ef84f5554be4c462108d4cbc855de4c
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: DATABASE_URL
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: ENCRYPTION_KEY
          envFrom:
            - configMapRef:
                name: rakazo-config
          command:
            - node
            - --enable-source-maps
            - dist/index.js
          workingDir: /app/apps/worker
          readinessProbe:
            exec:
              command:
                - node
                - dist/health-check.js
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      terminationGracePeriodSeconds: 300
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rakazo-data-pilot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rakazo-web
  labels:
    rakazo.example/phase: app
  namespace: rakazo
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rakazo-web
  template:
    metadata:
      labels:
        app: rakazo-web
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: web
          image: ghcr.io/vinny1892/rakazo/app:sha-f369df831ef84f5554be4c462108d4cbc855de4c
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 768Mi
          env:
            - name: SCREEN_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: SCREEN_PROXY_SECRET
          envFrom:
            - configMapRef:
                name: rakazo-config
          command:
            - node_modules/.bin/vite
            - preview
            - --host
            - 0.0.0.0
            - --port
            - "5173"
          workingDir: /app/apps/web
          volumeMounts:
            - name: web-assets
              mountPath: /app/apps/web/asset-archive
          ports:
            - containerPort: 5173
          readinessProbe:
            tcpSocket:
              port: 5173
            periodSeconds: 5
      volumes:
        - name: web-assets
          persistentVolumeClaim:
            claimName: rakazo-web-assets-pilot
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: rakazo-web
  labels:
    rakazo.example/phase: foundation
  namespace: rakazo
spec:
  selector:
    app: rakazo-web
  ports:
    - port: 5173
      targetPort: 5173
---
# Headless peers usados em TRUSTED_PROXIES. O web proxy e a API validam a
# cadeia de forwarding por DNS, sem confiar em CIDRs amplos.
apiVersion: v1
kind: Service
metadata:
  name: rakazo-web-peers
  namespace: rakazo
spec:
  clusterIP: None
  selector:
    app: rakazo-web
  ports:
    - port: 5173
      targetPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: rakazo-ingress-peers
  namespace: kube-system
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - port: 80
      targetPort: 8000
