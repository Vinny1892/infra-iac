apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-mcp-vinny-dev-br
  namespace: mcp
spec:
  secretName: grafana-mcp-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - grafana-mcp.vinny.dev.br
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-mcp
  namespace: mcp
  annotations:
    # Só rate limit. SEM basic auth, e isso é deliberado.
    #
    # O MCP tem autenticação própria por bearer token, e os dois disputam o
    # mesmo header `Authorization`: com `removeHeader: true` o Traefik apaga o
    # header e o MCP recebe requisição sem bearer; sem `removeHeader`, o MCP
    # recebe `Basic` onde espera `Bearer`. Não há como ter os dois.
    #
    # O bearer é a escolha melhor, não um consolo: ele também autentica quem
    # alcança o ClusterIP de dentro do cluster, onde o Ingress não passa, e o
    # upstream avisa que a ausência dele virará erro de inicialização.
    #
    # O Middleware de basic auth continua no repo para quem não tiver auth
    # próprio — o MCP do kubeshark é o próximo candidato.
    #
    # O formato é `<namespace>-<nome>@kubernetescrd`, então `mcp-rate-limit` é o
    # namespace `mcp` mais o middleware `rate-limit`, e não um recurso chamado
    # "mcp-rate-limit".
    traefik.ingress.kubernetes.io/router.middlewares: mcp-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: grafana-mcp.vinny.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-mcp
                port:
                  number: 80
  tls:
    - hosts:
        - grafana-mcp.vinny.dev.br
      secretName: grafana-mcp-tls
