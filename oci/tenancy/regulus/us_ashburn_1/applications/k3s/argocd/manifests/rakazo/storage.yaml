# StorageClass exclusiva do piloto: uma replica, sem custo adicional e sem
# exigir aumento do volume OCI. O cluster tem dois nodes, mas o Longhorn nao
# possui espaco agendavel para 52Gi x 2 replicas. Os PVCs podem ser expandidos
# depois; habilitar uma segunda replica exige liberar capacidade ou aumentar o
# disco (mudanca financeira separada, sempre sujeita a autorizacao explicita).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-single-replica
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: ext4
  dataLocality: disabled
  unmapMarkSnapChainRemoved: ignored
  disableRevisionCounter: "true"
  dataEngine: v1
  backupTargetName: default
---
# PVCs v2: os primeiros volumes foram provisionados com a StorageClass default
# de duas replicas e ficaram faulted antes de receber qualquer dado
# (status.actualSize=0). Como storageClassName e imutavel, os novos nomes sao a
# migracao declarativa segura. Os PVCs antigos ficam preservados pelo prune=false.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rakazo-database-pilot
  labels:
    rakazo.example/phase: foundation
  namespace: rakazo
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-single-replica
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rakazo-data-pilot
