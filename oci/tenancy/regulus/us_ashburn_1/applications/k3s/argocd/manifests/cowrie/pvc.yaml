apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cowrie-var
  namespace: honeypot
  annotations:
    # As capturas (JSON, ttylog, downloads) são a razão de o honeypot existir e
    # não se reconstroem a partir do repositório. Remover o app do git não pode
    # levar o volume junto.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
