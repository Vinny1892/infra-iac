# Backup agendado do cluster de teste.
#
# `method: plugin` e obrigatorio: o metodo barmanObjectStore nativo esta
# deprecado e a configuracao vive na CRD ObjectStore do plugin.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-teste-diario
  namespace: postgres
spec:
  # Formato de 6 campos (segundos primeiro): 03:30 todo dia.
  schedule: "0 30 3 * * *"
  backupOwnerReference: self
  cluster:
    name: pg-teste
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
