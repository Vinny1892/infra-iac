# Configuração não-sensível do piloto. Equivalente ao config.env do exemplo
# upstream, mas como ConfigMap simples (o ArgoCD aplica direto; sem kustomize).
# O sandbox fica desligado: SANDBOX_PROVIDER=none até haver capacidade e
# decisão de provider. O Board fica ligado: TICKET_BOARD_ENABLED=true.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rakazo-config
  namespace: rakazo
data:
  NODE_ENV: "production"
  DATA_DIR: "/data"
  CONTENT_ENCRYPTION: "on"
  SECRET_STORE: "encrypted"
  WAKEUP_DRIVER: "graphile"
  AGENT_RUNTIME: "pi"
  API_HOST: "0.0.0.0"
  API_PORT: "3100"
  API_PROXY_TARGET: "http://rakazo-api:3100"
  RAKAZO_HOST: "bot.vinny.dev.br"
  BETTER_AUTH_URL: "https://bot.vinny.dev.br"
  WEB_ORIGIN: "https://bot.vinny.dev.br"
  API_URL: "https://bot.vinny.dev.br"
  TRUSTED_PROXIES: "rakazo-web-peers.rakazo.svc.cluster.local,rakazo-ingress-peers.kube-system.svc.cluster.local"
  AUTH_PASSWORD_ENABLED: "true"
  SIGNUPS_ENABLED: "false"
  SIGNUP_ALLOWLIST: "vinnyaoe@gmail.com"
  OWNER_EMAIL: "vinnyaoe@gmail.com"
  EMAIL_PROVIDER: "none"
  SANDBOX_PROVIDER: "none"
  TICKET_BOARD_ENABLED: "true"
  # Permite endpoints MCP privados cadastrados pelo owner. Endereços de
  # metadata e link-local continuam bloqueados pelo Rakazo.
  MCP_ALLOW_PRIVATE_ENDPOINT: "true"
  DB_POOL_MAX: "10"
  RAYON_NUM_THREADS: "2"
---
# Estado das migrações aplicadas. O Job de migração grava aqui o hash da
# revisão; o valor sobrevive a syncs porque o ArgoCD ignora diferenças no campo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rakazo-migration-state
  namespace: rakazo
data:
  RAKAZO_DEPLOYED_MIGRATIONS: ""
