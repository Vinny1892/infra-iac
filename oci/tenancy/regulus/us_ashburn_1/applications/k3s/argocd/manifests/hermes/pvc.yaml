# Todo o estado do Hermes vive em /opt/data: config, credenciais, sessoes
# (SQLite), skills e memorias. Nao existe backend de object storage — a imagem
# ate compila uma SQLite propria para escapar do bug de WAL do Debian, o que
# deixa claro que o store e local. Por isso o volume e obrigatorio.
#
# storageClassName explicito de proposito: o cluster tem DUAS storage classes
# marcadas como default (local-path e longhorn) e, nesse caso, o Kubernetes
# escolhe de forma nao deterministica. Sem isto o PVC poderia cair no
# local-path e o estado sumiria junto com o node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: hermes
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
