# Basic auth do Kubeshark — Middleware e Secret duplicados de propósito.
#
# O mesmo par já existe em `manifests/mcp/`. Não é descuido: o Traefik v3 vem
# com `allowCrossNamespace` desligado, então um Middleware só pode ser
# referenciado por Ingress do MESMO namespace. O Kubeshark instala no namespace
# `kubeshark` (o chart define isso), então o middleware dele tem de morar lá.
#
# A alternativa era ligar `allowCrossNamespace` no Traefik e ter um middleware
# só. Foi recusada: afrouxa uma restrição para o cluster inteiro — qualquer
# Ingress passaria a poder referenciar middleware de qualquer namespace — para
# economizar dois objetos. Duplicar recurso é mais barato que ampliar
# permissão.
#
# O que NÃO está duplicado é a credencial: os dois ExternalSecrets leem o mesmo
# item do 1Password. Trocar a senha no cofre muda os dois.
#
# E aqui o basic auth é a ÚNICA proteção. `tap.auth` do Kubeshark só suporta
# SAML e vem desabilitado; não há bearer nativo como no MCP do Grafana. Se este
# middleware sair do Ingress, a interface fica aberta — e o que ela mostra é
# tráfego em claro do cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kubeshark-basic-auth
  namespace: kubeshark
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: kubeshark-basic-auth
    creationPolicy: Owner
  data:
    # `users` é obrigatório: nome de chave fixo no basicAuth do Traefik, sem
    # opção para mudar. O item do cofre guarda a linha de htpasswd já com hash
    # bcrypt, porque o ESO transporta valor sem transformar.
    - secretKey: users
      remoteRef:
        key: MCP Basic Auth/htpasswd
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  namespace: kubeshark
spec:
  basicAuth:
    secret: kubeshark-basic-auth
    # Remove o header Authorization antes de encaminhar, para o Kubeshark não
    # receber a credencial em toda requisição — e não gravá-la em log, que vai
    # para o VictoriaLogs.
    removeHeader: true
---
# Rate limit, também duplicado pelo mesmo motivo de namespace.
#
# Aqui a ordem da cadeia importa de verdade, ao contrário do Ingress do MCP do
# Grafana: o basic auth usa bcrypt cost 12, ~250ms de CPU por verificação, e
# com ele na frente ~8 req/s saturam um core só validando senha errada. O rate
# limit primeiro descarta a requisição sem credencial antes de custar CPU.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: kubeshark
spec:
  rateLimit:
    average: 30
    period: 1m
    burst: 15
    sourceCriterion:
      ipStrategy:
        # Sem isto o "cliente" seria a borda da Cloudflare e o limite viraria
        # global. Ressalva conhecida: header é falsificável enquanto o origin
        # aceitar 80/443 de 0.0.0.0/0 — ver o TODO do Flexible SSL.
        depth: 1
