# Credenciais S3 para o backup do PostgreSQL.
#
# Reaproveita o mesmo item e o mesmo bucket que ja guardam os backups do
# Longhorn — o destino difere pelo prefixo, definido no ObjectStore. Os nomes
# das chaves seguem o que o ObjectStore referencia, nao o do item no cofre.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-s3-creds
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: cnpg-s3-creds
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: Longhorn AWS S3 Backup/username
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: Longhorn AWS S3 Backup/password
