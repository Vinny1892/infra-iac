apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-memory-backup
  namespace: ai-memory
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: ai-memory
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: create-backup
              image: docker.io/akitaonrails/ai-memory:3.4.7
              env:
                - name: AI_MEMORY_SERVER_URL
                  value: http://ai-memory.ai-memory.svc:49374
                - name: AI_MEMORY_AUTH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: ai-memory-auth
                      key: token
              command:
                - /bin/sh
                - -c
              args:
                - >-
                  ai-memory backup --data-dir /data --to /backups/ai-memory-$(date +%F).tar.gz &&
                  ls -1t /backups/ai-memory-*.tar.gz | tail -n +8 | xargs -r rm --
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: backups
                  mountPath: /backups
          containers:
            - name: upload-s3
              image: amazon/aws-cli:2.42.1@sha256:b0102d2269f87d8531d931c1a59e248101ace586886e6c077058d94c1c37b846
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: ai-memory-s3-creds
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ai-memory-s3-creds
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
              command:
                - /bin/sh
                - -c
              args:
                - >-
                  latest=$(ls -1t /backups/ai-memory-*.tar.gz | head -n 1) &&
                  key="ai-memory/daily/${latest##*/}" &&
                  aws s3 cp "$latest" "s3://backup-longhorn-k3s/$key"
                  --only-show-errors --sse AES256 &&
                  old_keys=$(aws s3api list-objects-v2
                  --bucket backup-longhorn-k3s --prefix ai-memory/daily/
                  --query 'sort_by(Contents,&LastModified)[:-7].Key'
                  --output text) &&
                  for old_key in $old_keys; do
                    [ "$old_key" = "None" ] ||
                    aws s3api delete-object --bucket backup-longhorn-k3s
                    --key "$old_key" >/dev/null;
                  done
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: ai-memory-data
            - name: backups
              persistentVolumeClaim:
                claimName: ai-memory-backups
