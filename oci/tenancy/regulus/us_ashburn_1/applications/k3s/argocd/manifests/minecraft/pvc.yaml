# Explicitamente Longhorn: local-path e longhorn sao ambos default neste
# cluster, portanto deixar a escolha implicita pode criar um mundo sem backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data
  namespace: minecraft
spec:
  accessModes:
    - ReadWriteOnce
  # O deploy cria esta StorageClass com fromBackup apontando para o backup
  # remoto mais recente antes que o ArgoCD sincronize o workload.
  storageClassName: minecraft-data
  resources:
    requests:
      # Mantem o tamanho original do volume para que o restore preserve o mundo
      # e ainda deixa bastante margem no volume dedicado de 100 GB do Longhorn.
      storage: 15Gi
