# Explicitamente Longhorn: local-path e longhorn sao ambos default neste
# cluster, portanto deixar a escolha implicita pode criar um mundo sem backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data
  namespace: minecraft
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # Alem da reserva do proprio Longhorn, ele mantem 25% do disco livre para
      # snapshots/rebuild. Com o PVC do Hermes, 15 Gi e o maior tamanho que
      # preserva margem segura neste no de 50 GB.
      storage: 15Gi
