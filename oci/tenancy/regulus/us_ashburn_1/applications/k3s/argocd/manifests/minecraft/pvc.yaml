# Explicitamente Longhorn: local-path e longhorn sao ambos default neste
# cluster, portanto deixar a escolha implicita pode criar um mundo sem backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data
  namespace: minecraft
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # O disco Longhorn deste no tem cerca de 28 Gi livres apos a reserva do
      # proprio Longhorn e o PVC do Hermes. 25 Gi deixa margem para snapshots
      # temporarios e para o sistema continuar agendavel.
      storage: 25Gi
