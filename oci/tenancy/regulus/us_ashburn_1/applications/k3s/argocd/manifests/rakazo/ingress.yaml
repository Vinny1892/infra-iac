# Ingress do Rakazo: web na raiz, API no mesmo host (o vite preview serve o
# front e o cliente bate na API via APP_URL). TLS via cert-manager/letsencrypt,
# DNS via external-dns — padrão do cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rakazo
  namespace: rakazo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: rakazo.vinny.dev.br
spec:
  ingressClassName: traefik
  rules:
    - host: rakazo.vinny.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rakazo-web
                port:
                  number: 5173
  tls:
    - secretName: rakazo-tls
      hosts:
        - rakazo.vinny.dev.br
