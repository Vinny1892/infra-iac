apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      # Preso na danebola, o node escravo. O label vem do `--node-label` do
      # join do agent, no deploy.sh.
      #
      # Sem isto, a colocacao dependeria apenas de o `requests: 7Gi` abaixo nao
      # caber na vm-regulus (2 OCPU / 8 GB) — aritmetica de scheduler, que da o
      # resultado certo hoje e quebra em silencio no dia em que alguem ajustar o
      # request ou o tamanho de uma das VMs. O jogador nao perde acesso: o
      # Traefik atende a 25565 no IP reservado da vm-regulus e o kube-proxy
      # entrega no pod aqui.
      nodeSelector:
        workload: minecraft
      containers:
        - name: minecraft
          # Paper 26.1+ requer Java 25.
          image: itzg/minecraft-server:java25
          imagePullPolicy: IfNotPresent
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: PAPER
            # Pinado para evitar uma atualizacao inesperada do mundo em um
            # restart. A atualizacao e uma mudanca deliberada de Git.
            - name: VERSION
              value: "26.2"
            - name: MEMORY
              value: 6G
            - name: ONLINE_MODE
              # Aceita contas originais e clientes sem autenticacao Mojang.
              value: "FALSE"
            - name: ENABLE_RCON
              value: "TRUE"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-rcon
                  key: password
          ports:
            - name: minecraft
              containerPort: 25565
            - name: rcon
              containerPort: 25575
          startupProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              # `cpu` e piso de agendamento, nao teto de consumo. Com "2" o pod
              # reservava metade do no (2000m de 4000m) enquanto usava ~24m, e o
              # cluster ficava com 97% de CPU comprometida sem carga real —
              # qualquer workload novo deixava de ser agendavel.
              #
              # Nao ha `limits.cpu` aqui de proposito: o servidor precisa poder
              # usar mais nos picos (chunk gen, muitos jogadores), e sem limite
              # ele usa o que estiver ocioso. Reduzir o request nao muda isso.
              cpu: 500m
              # Memoria continua reservada de verdade: e heap de JVM, nao
              # comprime, e ficar sem ela derruba o servidor.
              memory: 7Gi
            limits:
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
