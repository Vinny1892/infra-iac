apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      containers:
        - name: minecraft
          # Paper 26.1+ requer Java 25.
          image: itzg/minecraft-server:java25
          imagePullPolicy: IfNotPresent
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: PAPER
            # Pinado para evitar uma atualizacao inesperada do mundo em um
            # restart. A atualizacao e uma mudanca deliberada de Git.
            - name: VERSION
              value: "26.2"
            - name: MEMORY
              value: 6G
            - name: ONLINE_MODE
              # Aceita contas originais e clientes sem autenticacao Mojang.
              value: "FALSE"
            - name: ENABLE_RCON
              value: "TRUE"
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minecraft-rcon
                  key: password
          ports:
            - name: minecraft
              containerPort: 25565
            - name: rcon
              containerPort: 25575
          startupProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: minecraft
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: "2"
              memory: 7Gi
            limits:
              memory: 8Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
