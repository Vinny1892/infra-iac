apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-memory-s3-creds
  namespace: ai-memory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: ai-memory-s3-creds
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: Longhorn AWS S3 Backup/username
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: Longhorn AWS S3 Backup/password