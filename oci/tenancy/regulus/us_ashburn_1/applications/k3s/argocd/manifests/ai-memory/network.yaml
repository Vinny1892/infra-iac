apiVersion: v1
kind: Service
metadata:
  name: ai-memory
  namespace: ai-memory
spec:
  selector:
    app: ai-memory
  ports:
    - name: http
      port: 49374
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-memory
  namespace: ai-memory
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - memory.vinny.dev.br
      secretName: ai-memory-tls
  rules:
    - host: memory.vinny.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-memory
                port:
                  name: http
