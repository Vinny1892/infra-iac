# O hostname é publicado pelo external-dns atrás do proxy Cloudflare. O Access
# é configurado no stack Terraform k3s/dns; esta camada adicional impede bypass
# direto ao IP de origem aceitando somente conexões vindas da rede Cloudflare.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cloudflare-only
  namespace: kubernetes-mcp
spec:
  ipAllowList:
    sourceRange:
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 108.162.192.0/18
      - 131.0.72.0/22
      - 141.101.64.0/18
      - 162.158.0.0/15
      - 172.64.0.0/13
      - 173.245.48.0/20
      - 188.114.96.0/20
      - 190.93.240.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 2400:cb00::/32
      - 2405:8100::/32
      - 2405:b500::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-mcp-server
  namespace: kubernetes-mcp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: k8s-mcp.vinny.dev.br
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    traefik.ingress.kubernetes.io/router.middlewares: kubernetes-mcp-cloudflare-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: k8s-mcp.vinny.dev.br
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: kubernetes-mcp-server
                port:
                  number: 8080
  tls:
    - secretName: kubernetes-mcp-server-tls
      hosts:
        - k8s-mcp.vinny.dev.br
