# Jobs de migração e bootstrap do owner. Reexecutáveis: o sync-wave garante
# ordem, e o ArgoCD recria o Job quando o manifesto muda (Replace=true seria
# necessário; aqui usamos a estratégia do upstream: Job único com backoffLimit 1).
apiVersion: batch/v1
kind: Job
metadata:
  name: rakazo-migrate-v2
  labels:
    rakazo.example/phase: migrate
  namespace: rakazo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: rakazo-migrate-v2
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: ghcr.io/vinny1892/rakazo/app:sha-f369df831ef84f5554be4c462108d4cbc855de4c
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: DATABASE_URL
            - name: DATABASE_MIGRATION_URL
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: DATABASE_MIGRATION_URL
          command:
            - node
            - dist/cli/migrate-database.js
          workingDir: /app/apps/api
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rakazo-bootstrap-v3
  labels:
    rakazo.example/phase: bootstrap
  namespace: rakazo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: rakazo-bootstrap-v3
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: bootstrap
          image: ghcr.io/vinny1892/rakazo/app:sha-f369df831ef84f5554be4c462108d4cbc855de4c
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: DATABASE_URL
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: ENCRYPTION_KEY
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: BETTER_AUTH_SECRET
            - name: OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rakazo-secrets
                  key: OWNER_PASSWORD
          envFrom:
            - configMapRef:
                name: rakazo-config
          command:
            - node
            - dist/cli/bootstrap-owner.js
          workingDir: /app/apps/api
---
# Monta o volume de dados sozinho antes de API e worker. Isso elimina a corrida
# de formatação do Longhorn quando dois Pods tentam inicializar o mesmo device.
apiVersion: batch/v1
kind: Job
metadata:
  name: rakazo-data-init-v1
  namespace: rakazo
  labels:
    rakazo.example/phase: data-init
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: rakazo-data-init-v1
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: initialize
          image: ghcr.io/vinny1892/rakazo/app:sha-f369df831ef84f5554be4c462108d4cbc855de4c
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          command:
            - node
            - -e
            - >-
              const fs=require('node:fs');
              fs.mkdirSync('/data',{recursive:true});
              fs.writeFileSync('/data/.volume-initialized','ok\n');
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rakazo-data-pilot
