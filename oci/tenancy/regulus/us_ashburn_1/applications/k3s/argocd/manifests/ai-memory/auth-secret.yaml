# A credencial fica exclusivamente no 1Password. O External Secrets Operator
# materializa o campo `credential` como a chave `token` esperada pelo workload.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-memory-auth
  namespace: ai-memory
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ai-memory-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: token
      remoteRef:
        key: op://Lab-IAC/AI Memory/credential
