# Token gerado dentro do cluster pelo External Secrets Operator.
# O valor nunca passa pelo Git. CreatedOnce evita rotacao em reconciliacoes
# normais; se o Secret for perdido numa recriacao, o ESO gera outro.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ai-memory-auth
  namespace: ai-memory
spec:
  length: 64
  digits: 10
  symbols: 0
  allowRepeat: true
  encoding: raw
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-memory-auth
  namespace: ai-memory
spec:
  refreshPolicy: CreatedOnce
  target:
    name: ai-memory-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        token: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: ai-memory-auth
