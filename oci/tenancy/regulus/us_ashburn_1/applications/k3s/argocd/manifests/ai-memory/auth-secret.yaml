# A credencial fica exclusivamente no 1Password. O External Secrets Operator
# materializa o campo `credential` como a chave `token` esperada pelo workload.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-memory-auth
  namespace: ai-memory
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ai-memory-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: token
      remoteRef:
        # O provider do 1Password não aceita espaços na URI; usar o UUID mantém
        # a referência estável mesmo se o título do item mudar.
        key: op://Lab-IAC/2jt63yc6x26tsfzd4vv3hwvytq/credential
