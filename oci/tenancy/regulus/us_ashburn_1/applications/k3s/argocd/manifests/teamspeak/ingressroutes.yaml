apiVersion: traefik.io/v1alpha1
kind: IngressRouteUDP
metadata:
  name: teamspeak-voice
  namespace: teamspeak
spec:
  entryPoints:
    - teamspeak-voice
  routes:
    - services:
        - name: teamspeak
          port: 9987
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: teamspeak-file
  namespace: teamspeak
spec:
  entryPoints:
    - teamspeak-file
  routes:
    - match: HostSNI(`*`)
      services:
        - name: teamspeak
          port: 30033
