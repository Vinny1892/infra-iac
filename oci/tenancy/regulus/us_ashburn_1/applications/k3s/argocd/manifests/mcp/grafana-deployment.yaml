apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
  namespace: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-mcp
  template:
    metadata:
      labels:
        app: grafana-mcp
    spec:
      # No control plane: o MCP fala com o Grafana, que está no mesmo node, e a
      # danebola está com 75% da memória requisitada pelo Minecraft. Não é
      # requisito de funcionamento — é só onde sobra espaço.
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: mcp
          # 1.3.0 é a mais recente com build linux/arm64, verificado no manifest
          # do Docker Hub (digest arm64
          # sha256:3192e25035035c51ba3c8b36fe274e6ad8e188a83443c01814cdbf890df2a6fe).
          # O cluster é inteiramente aarch64; imagem sem arm64 não sobe aqui, e
          # o erro aparece só no pull.
          image: grafana/mcp-grafana:1.3.0
          args:
            # A imagem já sobe em SSE por default (ao contrário do binário, que
            # é stdio), mas o transporte fica explícito: é o contrato com o
            # cliente MCP do outro lado, não um detalhe do empacotamento.
            - -t
            - streamable-http
            # `--address` default é `localhost:8000`. Dentro de container isso
            # escuta só no loopback do namespace de rede e o Service nunca
            # entrega nada — o pod fica Running e a conexão morre sem log útil.
            # Mesma família do ListenStream que abriu socket só em IPv6.
            - --address
            - 0.0.0.0:8000
          env:
            - name: GRAFANA_URL
              # Service interno, não o host público: o tráfego não sai do
              # cluster, não depende de DNS externo nem da Cloudflare, e o
              # token não atravessa a internet.
              value: http://vmks-grafana.monitoring.svc.cluster.local:80
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp-token
                  key: token
          ports:
            - name: http
              containerPort: 8000
          # Probe TCP porque não confirmei que existe endpoint de health nesta
          # versão, e não vou inventar um path. Ressalva conhecida: TCP prova que
          # o processo escuta, não que o MCP responde nem que o token do Grafana
          # é válido — token revogado deixaria o pod Ready e inútil. Quando
          # houver endpoint verificado, trocar por HTTP.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-mcp
  namespace: mcp
spec:
  selector:
    app: grafana-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
