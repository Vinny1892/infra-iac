# Publica apenas o dashboard (9119). O gateway/API (8642) fica interno.
#
# A protecao vem do Cloudflare Access, na borda, antes do trafego chegar aqui —
# o dashboard guarda API keys e a doc do Hermes desaconselha expo-lo sem
# autenticacao. Para o Access funcionar, o registro precisa estar proxied
# (nuvem laranja) na Cloudflare; o external-dns cria o A apontando para o IP
# reservado e a policy do Access e configurada no painel.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes
  namespace: hermes
spec:
  ingressClassName: traefik
  rules:
    - host: hermes.vinny.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hermes
                port:
                  number: 9119
  tls:
    - hosts:
        - hermes.vinny.dev.br
      secretName: hermes-tls
