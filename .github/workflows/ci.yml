name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Tools
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Run Lint
        run: make lint

  test:
    name: Unit Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Tools
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Install Dependencies
        working-directory: tests
        run: go mod download

      - name: Run Unit Tests
        run: make test-unit
